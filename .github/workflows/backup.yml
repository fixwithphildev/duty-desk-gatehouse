name: Weekly database backup

# Free-tier Supabase has no automated backups. This dumps each project's
# database every Monday and stores the dumps as a workflow artifact, so
# there's always a recent snapshot to restore from if data is ever lost by
# mistake or a provider incident. Artifacts are only visible to people with
# read access to this repo.
#
# Requires the `postgresql-client` apt package for pg_dump (installed below)
# and a Postgres connection string per project — NOT the same as the
# SUPABASE_URL/SERVICE_ROLE_KEY secrets used for the REST API. Find it in the
# Supabase dashboard under each project's Connect -> Direct connection string
# tab. Use the "Session pooler" option, NOT "Direct connection" — Supabase's
# direct connection is IPv6-only by default, and GitHub-hosted runners can't
# reach IPv6 hosts (pg_dump fails with "Network is unreachable"). The Session
# pooler string is IPv4-compatible and works from GitHub Actions.

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday, 05:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu's default postgresql-client package (v16) refuses to dump from
      # Supabase's Postgres 17 servers ("aborting because of server version
      # mismatch") — pg_dump must be the same version or newer than the
      # server. Installing from the official PostgreSQL apt repo instead of
      # Ubuntu's gets a matching client.
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # Called by full path, not bare `pg_dump` — Ubuntu's pg_dump wrapper
      # script still resolves to the older v16 binary even with v17 also
      # installed, which silently reintroduces the version-mismatch error.
      - name: Dump Duty Desk
        continue-on-error: true
        run: /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.DUTY_DESK_DB_URL }}" --no-owner --no-privileges -f duty-desk.sql

      - name: Dump Gatehouse
        continue-on-error: true
        run: /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.GATEHOUSE_DB_URL }}" --no-owner --no-privileges -f gatehouse.sql

      # Once the three projects are consolidated into one Supabase org/project
      # (see the consolidation plan), this step and DUTY_DESK/GATEHOUSE above
      # collapse into a single dump of the one remaining project.
      - name: Dump Maintenance Desk
        continue-on-error: true
        run: /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.MAINTENANCE_DESK_DB_URL }}" --no-owner --no-privileges -f maintenance-desk.sql

      - name: Upload backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backups-${{ github.run_id }}
          path: |
            duty-desk.sql
            gatehouse.sql
            maintenance-desk.sql
          if-no-files-found: warn
          retention-days: 60
